[project]
name = "geneweaver-v3"
version = "0.1.0"
description = "Agentic prokaryotic genome annotation: CAM and PAM LangGraph agents, a successor to AGMIAL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.84",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "pyrodigal>=3.5",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
